name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Logic tests
        run: bash tests/run.sh

      - name: A real post, end to end (needs the network; does not fail the build)
        continue-on-error: true
        run: build-tests/logic_tests --live

      - name: Build
        run: bash build.sh

      - name: Verify
        run: |
          APP=build/Payload/GifStash.app
          xcrun lipo -info "$APP/GifStash" "$APP/PlugIns/Share.appex/Share" "$APP/PlugIns/Keyboard.appex/Keyboard"
          xcrun otool -l "$APP/GifStash" | grep -A5 LC_BUILD_VERSION | head -6
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleIcons|AppIcon|UILaunchScreen|MinimumOSVersion|CFBundleShortVersionString' || true
          plutil -p "$APP/PlugIns/Share.appex/Info.plist"
          codesign -d --entitlements - --xml "$APP/GifStash" | plutil -p - || true
          codesign -d --entitlements - --xml "$APP/PlugIns/Share.appex/Share" | plutil -p - || true
          plutil -p "$APP/PlugIns/Keyboard.appex/Info.plist"
          codesign -d --entitlements - --xml "$APP/PlugIns/Keyboard.appex/Keyboard" | plutil -p - || true
          codesign --verify --verbose "$APP"
          unzip -l build/GifStash.ipa
          shasum -a 256 build/GifStash.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GifStash
          path: build/GifStash.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-gifs
          path: build-tests/out
          if-no-files-found: ignore
